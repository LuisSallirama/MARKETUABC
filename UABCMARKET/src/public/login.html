<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - UABC Marketplace</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #00723f; margin-bottom: 20px; }
        .campo { margin-bottom: 15px; }
        .campo label { display: block; font-weight: bold; margin-bottom: 5px; }
        .campo input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: #00723f; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #00562f; }
        #mensaje { margin-top: 15px; text-align: center; font-weight: bold; color: red; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Iniciar Sesión UABC</h2>
        <form id="formLogin">
            <div class="campo">
                <label for="email">Correo Institucional:</label>
                <input type="email" id="email" placeholder="usuario@uabc.edu.mx" required>
            </div>
            <div class="campo">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn">Ingresar</button>
        </form>
        <div id="mensaje"></div>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const mensajeDiv = document.getElementById('mensaje');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    // Guardamos la sesión del usuario en el navegador
                    localStorage.setItem('usuarioUABC', JSON.stringify(data.usuario));
                    window.location.href = '/catalogo.html';
                } else {
                    mensajeDiv.innerText = data.error;
                }
            } catch (err) {
                mensajeDiv.innerText = 'Error al conectar con el servidor.';
            }
        });
    </script>
</body>
</html>
