<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publicar Producto - UABC Marketplace</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { text-align: center; color: #00723f; margin-bottom: 20px; }
        .campo { margin-bottom: 15px; }
        .campo label { display: block; font-weight: bold; margin-bottom: 5px; }
        .campo input, .campo textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: #00723f; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #00562f; }
        .btn-volver { display: block; text-align: center; margin-top: 15px; color: #555; text-decoration: none; font-size: 0.9rem; }
        #mensaje { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Publicar Producto / Servicio</h2>
        <form id="formProducto">
            <div class="campo">
                <label for="titulo">Título del artículo:</label>
                <input type="text" id="titulo" placeholder="Ej. Calculadora Científica TI-84" required>
            </div>
            <div class="campo">
                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion" rows="3" placeholder="Detalles del producto..."></textarea>
            </div>
            <div class="campo">
                <label for="precio">Precio ($ MXN):</label>
                <input type="number" id="precio" step="0.01" placeholder="250.00" required>
            </div>
            <div class="campo">
                <label for="punto_encuentro">Punto de entrega en UABC:</label>
                <input type="text" id="punto_encuentro" placeholder="Ej. Bancas frente a Biblioteca" required>
            </div>
            <button type="submit" id="btnPublicar" class="btn">Publicar</button>
        </form>
        <div id="mensaje"></div>
        <a href="/catalogo.html" class="btn-volver">← Volver al Catálogo</a>
    </div>

    <script>
        const usuarioSesion = JSON.parse(localStorage.getItem('usuarioUABC'));

        // Redirigir si no hay inicio de sesión
        if (!usuarioSesion) {
            window.location.href = '/login.html';
        } else if (usuarioSesion.es_vendedor !== 1) {
            // Deshabilitar formulario si aún no es vendedor aprobado
            document.getElementById('formProducto').style.display = 'none';
            document.getElementById('mensaje').style.color = '#d9534f';
            document.getElementById('mensaje').innerHTML = ' Tu cuenta aún no tiene permisos de vendedor.<br>Solicita tu aprobación en tu perfil.';
        }

        document.getElementById('formProducto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mensajeDiv = document.getElementById('mensaje');
            mensajeDiv.innerText = 'Guardando...';

            const datos = {
                titulo: document.getElementById('titulo').value,
                descripcion: document.getElementById('descripcion').value,
                precio: document.getElementById('precio').value,
                punto_encuentro: document.getElementById('punto_encuentro').value,
                vendedor_id: usuarioSesion.id // Se envía el ID real del usuario logueado
            };

            try {
                const res = await fetch('/api/productos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });

                const resultado = await res.json();
                if (res.ok) {
                    mensajeDiv.style.color = 'green';
                    mensajeDiv.innerText = '¡Producto publicado!';
                    document.getElementById('formProducto').reset();
                } else {
                    mensajeDiv.style.color = 'red';
                    mensajeDiv.innerText = resultado.error;
                }
            } catch (err) {
                mensajeDiv.style.color = 'red';
                mensajeDiv.innerText = 'Error al conectar con el servidor.';
            }
        });
    </script>
</body>
</html>
